name: QEMU VM Manager Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r qemu_vm_manager/requirements.txt
        
    - name: Install QEMU (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-utils qemu-system-x86
        
    - name: Install QEMU (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        # Install Chocolatey and QEMU using PowerShell
        choco install qemu --yes
        
    - name: Run unit tests
      run: |
        pytest qemu_vm_manager/tests/ -xvs
        
    - name: Generate coverage report
      run: |
        pytest --cov=qemu_vm_manager --cov-report=xml
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  mock-integration:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r qemu_vm_manager/requirements.txt
        
    - name: Run integration tests with mocked QEMU
      run: |
        # Run only integration tests with mocked QEMU binary
        pytest qemu_vm_manager/tests/test_integration.py -xvs 